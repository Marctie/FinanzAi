<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="transactions">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Movimenti</ion-label>
    </ion-tab-button>

    <ion-tab-button class="tab-add" tab="add-transaction" data-testid="tab-add" aria-label="Nuovo movimento">
      <ion-icon name="add-circle" color="primary"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="budgets">
      <ion-icon name="pie-chart-outline"></ion-icon>
      <ion-label>Budget</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="shared" data-testid="tab-shared">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Condivisi</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Altro</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
