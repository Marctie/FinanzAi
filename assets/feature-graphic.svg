<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e85c8"/>
      <stop offset="100%" stop-color="#0f3a5c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- decorative faint trend line across background -->
  <polyline points="0,380 140,340 260,400 400,300 540,340 680,220 820,260 1024,140"
    stroke="rgba(255,255,255,0.08)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mark -->
  <g transform="translate(90,175) scale(6.2)">
    <rect x="6" y="5" width="3.5" height="30" rx="1.75" fill="#ffffff"/>
    <rect x="6" y="5" width="20" height="3.5" rx="1.75" fill="#ffffff"/>
    <rect x="6" y="18.5" width="15" height="3.5" rx="1.75" fill="#ffffff"/>
    <polyline points="22,30 27,22 31,26 37,13" stroke="#4fd67f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="37" cy="13" r="2.8" fill="#4fd67f"/>
  </g>

  <text x="420" y="255" font-family="'Work Sans', Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Finanz<tspan fill="#4fd67f">AI</tspan></text>
  <text x="422" y="305" font-family="'Work Sans', Arial, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Le tue finanze, sotto controllo</text>
</svg>
